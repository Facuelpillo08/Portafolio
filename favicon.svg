<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo obsidiana editorial profundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15151e" />
      <stop offset="45%" stop-color="#0c0c10" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Bisel sutil de lujo en el marco exterior -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)" />
      <stop offset="45%" stop-color="rgba(255, 255, 255, 0.05)" />
      <stop offset="100%" stop-color="rgba(239, 68, 68, 0.45)" />
    </linearGradient>

    <!-- Resplandor carmesí ambiental de profundidad -->
    <radialGradient id="redAura" cx="75%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#ff2247" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </radialGradient>

    <!-- Degradado platino metálico para la 'F' -->
    <linearGradient id="fGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Degradado rojo carmesí metálico para la 'A' (fiel a los títulos de la portada) -->
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3355" />
      <stop offset="32%" stop-color="#ef1442" />
      <stop offset="65%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Sombra volumétrica escultórica -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Resplandor neón para el punto de firma de marca -->
    <filter id="neonDotGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff2247" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#ff2247" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Contenedor squircle moderno de alta precisión -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="5" />
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#redAura)" />

  <g filter="url(#shadowFilter)">
    <!-- 1. LETRA 'F': Trazado único vectorial con vértices redondeados (Blanco Platino) -->
    <path d="M 76 142 Q 76 136 82 136 L 222 136 Q 228 136 228 142 L 228 182 Q 228 188 222 188 L 132 188 L 132 242 L 204 242 Q 210 242 210 248 L 210 284 Q 210 290 204 290 L 132 290 L 132 370 Q 132 376 126 376 L 82 376 Q 76 376 76 370 Z" fill="url(#fGrad)" />

    <!-- 2. LETRA 'A': Trazado compuesto con contraforma negativa integrada (Rojo Carmesí Metálico) -->
    <path d="M 302 136 L 274 136 L 218 376 L 272 376 L 287 312 L 317 312 L 332 376 L 386 376 L 330 136 Z M 302 192 L 320 266 L 284 266 Z" fill="url(#aGrad)" fill-rule="evenodd" />

    <!-- 3. PUNTO DE FIRMA '.': Rojo Neón Luminoso idéntico al logo de portada -->
    <circle cx="420" cy="354" r="20" fill="#ff2247" filter="url(#neonDotGlow)" />
  </g>
</svg>